name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  auth0-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test auth0/primary-auth-time.test.js

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[hosted,dev]"
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format
        run: ruff format --check .
      - name: Pyright
        run: pyright
      - name: Marketplace API-only capability gate
        run: python -m freeagent_ai.package_contract

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install server test dependencies
        run: pip install -e ".[hosted,dev]"
      - name: Run server tests (browser tests skipped)
        run: pytest

  document-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: pip install -e ".[hosted,dev,browser]"
      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Run PDF browser tests
        run: pytest tests/test_document_browser.py

  deploy-landing:
    needs: [auth0-action, lint, test, document-browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOYMENT_PROJECT: ${{ secrets.DEPLOYMENT_PROJECT }}
      DEPLOYMENT_REGION: ${{ secrets.HOSTING_BACKEND_REGION }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: production-landing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build static website
        run: |
          test ! -e "$RUNNER_TEMP/landing"
          python3 freeagent_ai/landing.py --static --output "$RUNNER_TEMP/landing"
      - name: Check deployment identity configuration
        env:
          DELIVERY_PROVIDER: ${{ secrets.DELIVERY_IDENTITY_PROVIDER }}
          DELIVERY_ACCOUNT: ${{ secrets.DELIVERY_SERVICE_ACCOUNT }}
        run: |
          test -n "$DELIVERY_PROVIDER"
          test -n "$DELIVERY_ACCOUNT"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.DELIVERY_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.DELIVERY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Publish merged website
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.DEPLOYMENT_PROJECT }}
          FIREBASE_HOSTING_SITE: ${{ secrets.FIREBASE_HOSTING_SITE }}
          HOSTING_BACKEND_SERVICE: ${{ secrets.HOSTING_BACKEND_SERVICE }}
          HOSTING_BACKEND_REGION: ${{ secrets.HOSTING_BACKEND_REGION }}
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          python3 scripts/publish_landing.py --root "$RUNNER_TEMP/landing" --config hosting.json
      - name: Verify public website and protected MCP
        run: |
          for path in / /privacy/ /terms/ /support/ /robots.txt /sitemap.xml /landing-assets/site.css; do
            curl --fail --silent --show-error --max-time 15 --retry 5 --retry-delay 3 --retry-all-errors "https://freeagent-ai.avalou.co$path" --output /dev/null
          done
          status=$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' https://freeagent-ai.avalou.co/mcp)
          test "$status" = 401 || test "$status" = 403
