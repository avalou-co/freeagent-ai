name: Build hosted image
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.DELIVERY_IDENTITY_PROVIDER }}
          service_account: example-delivery@example-project.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          push: true
          tags: europe-west1-docker.pkg.dev/example-project/freeagent-ai/mcp:${{ github.sha }}
      - name: Record Terraform handoff
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "Reviewed image reference for Terraform is europe-west1-docker.pkg.dev/example-project/freeagent-ai/mcp@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
