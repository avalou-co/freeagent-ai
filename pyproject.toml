[project]
name = "freeagent-ai"
version = "0.1.0"
description = "Generic FreeAgent API mechanics and agent workflows. No business-specific logic."
requires-python = ">=3.9"
dependencies = ["typer>=0.12"]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.scripts]
freeagent-ai = "freeagent_ai.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["freeagent_ai"]
